<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Try the Drawing Captcha demo! Experience an innovative, brand-new drawing-based captcha system seamlessly integrated into a modern contact form. Enhance security and user experience with Drawing Captcha.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <meta name="robots" content="noindex">
    <title>Try out Drawing Captcha</title>
</head>

<body>
    <!-- Template by  https://codepen.io/krisantuswanandi/pen/KxrgeZ-->
    <div class="background">
        <div class="container">
            <img src="../img/DC-Logo-White.png" alt="Drawin-Captcha-Logo" class="logo">

            <div class="screen">
                <div class="screen-header">
                    <div class="screen-header-left">
                        <div class="screen-header-button close"></div>
                        <div class="screen-header-button maximize"></div>
                        <div class="screen-header-button minimize"></div>
                    </div>
                    <div class="screen-header-right">
                        <div class="screen-header-ellipsis"></div>
                        <div class="screen-header-ellipsis"></div>
                        <div class="screen-header-ellipsis"></div>
                    </div>
                </div>
                <div class="screen-body">
                    <div class="screen-body-item left">
                        <div class="app-title">
                            <span>Welcome to Drawing Captcha 🎨</span>
                        </div>
                        <!-- <div class="app-contact">CONTACT INFO: info@drawing-captcha.com</div> -->
                    </div>
                    <div class="screen-body-item">
                        <form drawing-captcha class="app-form" id="contactForm" action="../success.html">
                            <div class="app-form-group">
                                <input class="app-form-control" type="text" id="name" placeholder="Your Name" required>
                            </div>
                            <div class="app-form-group">
                                <input class="app-form-control" type="email" id="email" placeholder="EMAIL" required>
                            </div>
                            <div class="app-form-group message">
                                <input class="app-form-control" type="text" id="message" placeholder="MESSAGE" required>
                            </div>
                            <div class="app-form-group buttons">
                                <button type="reset" class="app-form-button">CANCEL</button>
                                <button type="submit" class="app-form-button">SEND</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
    </div>
    <script>
        var CaptchaHiddenAPIKey = "6f1cd6f7-4fde-421d-91e3-0096845c2011";
        var CaptchaServerWithPort = "https://drawing.wpesic.dev";
    </script>
    <script src="https://cdn.drawing-captcha.com/captcha.js" onload="(function(){initializeCaptcha()})()"></script>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (event) {
            var name = document.getElementById('name').value;
            localStorage.setItem('contactName', name);
        });
    </script>
</body>

</html>
